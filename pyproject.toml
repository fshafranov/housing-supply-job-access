[project]
name = "housing-supply-job-access"
version = "0.1.0"
description = "Do new homes get built near jobs? Job access, commutes and supply elasticity of US housing by decade built"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "matplotlib>=3.11.2",
    "numpy",
    "openpyxl>=3.1.5",
    "pandas",
    "pyarrow>=26.0.1",
    "pydantic-settings",
    "pyfixest",
    "structlog",
    "tabulate>=0.10.0",
    "tenacity",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
